<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Co-Pilot launch film · style frames</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --canvas:#FAF8F3; --surface:#FFFFFF; --surface-soft:#F7F3EC; --cream:#FBFAF7;
  --ink:#15140F; --ink-soft:#2A251F; --smoke:#6E665C; --faint:#9A9286;
  --ember:#E2511C; --ember-deep:#B23B0E; --ember-light:#F2622A; --ember-tint:#FBE7DA;
  --indigo:#3756C4; --indigo-deep:#273F96;
  --indigo-grad:linear-gradient(155deg,#4B6FE2 0%,#3756C4 52%,#273F96 100%);
  --ruled:rgba(21,20,15,0.09); --ruled-soft:rgba(21,20,15,0.055);
  --iri:conic-gradient(from var(--a,0deg),#DB4B93,#E2511C,#D79014,#2E9E50,#13957A,#3A6FD6,#8A55D2,#DB4B93);
  --sans:"Geist",system-ui,sans-serif; --mono:"Geist Mono",ui-monospace,monospace; --serif:"Instrument Serif",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--canvas);font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
#cam{position:absolute;left:960px;top:540px;width:0;height:0;transform-origin:0 0}
.abs{position:absolute}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.14em}

/* composer */
.composer{position:absolute;border-radius:26px;background:var(--surface);}
.glow{position:absolute;border-radius:40px;background:var(--iri);filter:blur(22px);opacity:.9}
.edge{position:absolute;border-radius:28px;background:var(--iri);}
.send{position:absolute;width:44px;height:44px;border-radius:15px;background:var(--indigo-grad);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(39,63,150,.18),0 18px 30px -16px rgba(39,63,150,.6)}

/* phone */
.bezel{position:absolute;border-radius:62px;background:var(--ink);box-shadow:0 60px 120px -50px rgba(21,20,15,.55),0 0 0 1.5px #2a2722 inset}
.screen{position:absolute;border-radius:51px;background:var(--canvas);overflow:hidden}
.bubble-u{position:absolute;background:var(--ember);color:var(--cream);border-radius:20px 20px 6px 20px;font-size:15px;line-height:21.5px;padding:12px 15px;white-space:pre;box-shadow:0 14px 28px -18px rgba(178,59,14,.7)}
.bubble-a{position:absolute;background:var(--surface);color:var(--ink-soft);border:1px solid var(--ruled);border-radius:20px 20px 20px 6px;font-size:15px;line-height:21.5px;padding:12px 15px;box-shadow:0 1px 2px rgba(21,20,15,.04),0 10px 26px -18px rgba(21,20,15,.18)}
.pill{position:absolute;height:42px;border-radius:999px;font-size:14.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;white-space:nowrap}

/* profile card */
.card{position:absolute;width:330px;height:440px;border-radius:28px;background:var(--ink);border:1px solid rgba(255,255,255,.06);overflow:hidden;color:var(--cream)}
.card .ph{position:absolute;left:10px;top:10px;width:310px;height:232px;border-radius:20px;overflow:hidden}
.card .nm{position:absolute;left:24px;top:262px;font-size:25px;font-weight:620;letter-spacing:-.015em}
.card .rl{position:absolute;left:24px;top:299px;font-family:var(--mono);font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:rgba(251,250,247,.52)}
.card .ds{position:absolute;left:24px;top:324px;width:282px;font-size:15.5px;line-height:21px;color:rgba(251,250,247,.8)}
.card .ft{position:absolute;left:24px;top:388px;display:flex;align-items:baseline;gap:7px}
.card .ft b{font-size:30px;font-weight:720;color:var(--ember-light);letter-spacing:-.02em}
.card .ft span{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:rgba(251,250,247,.5)}
.card .ch{position:absolute;right:20px;top:392px;height:30px;padding:0 13px;border-radius:999px;border:1px solid rgba(251,250,247,.18);font-size:13px;font-weight:550;color:rgba(251,250,247,.82);display:flex;align-items:center}
.best{position:absolute;left:22px;top:22px;height:34px;padding:0 14px 0 11px;border-radius:999px;background:var(--cream);color:var(--ink);font-size:14px;font-weight:650;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.best i{width:9px;height:9px;border-radius:50%;background:var(--ember);display:block}

.label{position:absolute;left:28px;bottom:24px;font-family:var(--mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;padding:7px 12px;border-radius:8px;background:rgba(21,20,15,.72);color:#FBFAF7;z-index:99}
</style>
</head>
<body>
<div id="stage"><div id="cam"></div></div>
<script src="vendor/mf-mascot-engine.js"></script>
<script>
// ── Shared data ─────────────────────────────────────────────────────────────
const BPM = 130, BEAT = 60 / BPM;
const REQUEST = [
  "I'm tired of building this alone,",
  "I've got the design and a prototype",
  "but I need someone technical"
];
const PROFILES = [
  { n: 'Jonas Berger',  r: 'ML Engineer · München', d: 'Built recommendation systems for 30M users.', fit: 82, c: 'Full-time', hue: '#3A6FD6' },
  { n: 'Sofia Ruiz',    r: 'Backend · Hamburg',     d: 'Rust and Postgres, four years in fintech.',  fit: 88, c: 'Full-time', hue: '#13957A' },
  { n: 'Mehmet Kaya',   r: 'Full-stack · Köln',     d: 'Two exits. Ships something every Friday.',    fit: 86, c: 'Part-time', hue: '#8A55D2' },
  { n: 'Anna Wojcik',   r: 'Full-stack · Berlin',   d: 'AI-focused, 7 years in. Her MVP has 50 customers.', fit: 94, c: 'Full-time', hue: '#E2511C' },
  { n: 'Priya Nair',    r: 'Mobile · Berlin',       d: 'Shipped three apps past a million installs.', fit: 84, c: 'Full-time', hue: '#DB4B93' },
  { n: 'Lukas Thiel',   r: 'DevOps · Leipzig',      d: 'Scaled infra from zero to 40M requests a day.', fit: 79, c: 'Part-time', hue: '#D79014' },
];
const CAM = document.getElementById('cam');
const STAGE = document.getElementById('stage');
function camera(z, x, y) { CAM.style.transform = `scale(${z}) translate(${-x}px,${-y}px)`; }
function el(html, parent = CAM) { const t = document.createElement('template'); t.innerHTML = html.trim(); const n = t.content.firstChild; parent.appendChild(n); return n; }
function label(s) { el(`<div class="label">${s}</div>`, STAGE); }

// ── Atoms ───────────────────────────────────────────────────────────────────
const ICON_SEND = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>`;
const COPILOT_MARK = (s, c, sp) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6l5 6-5 6"/><path d="M11 6l5 6-5 6"/><circle cx="20" cy="12" r="1.6" fill="${sp}" stroke="none"/></svg>`;
const ICON_MF = (h, c, sp, dot) => `<svg width="${h * 1.4}" height="${h}" viewBox="0 0 140 100" fill="none"><path d="M8 14 L62 50 L8 86" stroke="${c}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M132 14 L78 50 L132 86" stroke="${sp}" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="50" r="6" fill="${dot || c}"/></svg>`;

// Placeholder portrait until real photography lands (duotone, head + shoulders).
function portrait(hue, w, h, seed = 0) {
  const sx = w / 310, sy = h / 232;
  return `<svg width="${w}" height="${h}" viewBox="0 0 310 232" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="pg${seed}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${hue}" stop-opacity=".95"/><stop offset="1" stop-color="#15140F" stop-opacity=".9"/></linearGradient>
    <radialGradient id="pr${seed}" cx=".3" cy=".2" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>
    <rect width="310" height="232" fill="#15140F"/><rect width="310" height="232" fill="url(#pg${seed})"/>
    <g fill="#FBFAF7" fill-opacity=".2"><circle cx="${155 + (seed % 3 - 1) * 18}" cy="98" r="44"/><path d="M${60 + (seed % 3 - 1) * 18} 240 C${70 + (seed % 3 - 1) * 18} 168 ${240 + (seed % 3 - 1) * 18} 168 ${250 + (seed % 3 - 1) * 18} 240Z"/></g>
    <rect width="310" height="232" fill="url(#pr${seed})"/>
    <text x="14" y="220" font-family="Geist Mono" font-size="10" letter-spacing="1.6" fill="#FBFAF7" fill-opacity=".55">PHOTO</text></svg>`;
}

function profileCard(p, i, x, y, opts = {}) {
  const lift = opts.best ? `translate(-50%,-50%) translateY(-26px) scale(1.045)` : `translate(-50%,-50%)`;
  const shadow = opts.best ? '0 50px 90px -30px rgba(70,16,0,.65)' : '0 34px 60px -30px rgba(70,16,0,.5)';
  return el(`<div class="card" style="left:${x}px;top:${y}px;transform:${lift};box-shadow:${shadow}">
    <div class="ph">${portrait(p.hue, 310, 232, i)}</div>
    ${opts.best ? '<div class="best"><i></i>Best match</div>' : ''}
    <div class="nm">${p.n}</div><div class="rl">${p.r}</div><div class="ds">${p.d}</div>
    <div class="ft"><b>${p.fit}</b><span>FIT</span></div><div class="ch">${p.c}</div></div>`);
}

function mascot(size, t, state = 'idle') {
  const M = window.MFMascot, e = new M.BotEngine(M.RAYON, state);
  e.reset(state, 0);
  const svg = `<svg viewBox="${-M.VB} ${-M.VB} ${M.VB * 2} ${M.VB * 2}" width="${size * 1.58}" height="${size * 1.58}" style="overflow:visible;display:block">${M.svgMarkup(e.sample(t), 'm' + Math.round(t * 100), '#E2511C', '#FAF8F3', '#3756C4')}</svg>`;
  return svg;
}

// ── Phone ───────────────────────────────────────────────────────────────────
// World origin = phone screen centre. Screen 428×900, bezel 11px.
const SW = 428, SH = 900, BZ = 11;
function phone() {
  el(`<div class="bezel" style="left:${-SW / 2 - BZ}px;top:${-SH / 2 - BZ}px;width:${SW + BZ * 2}px;height:${SH + BZ * 2}px"></div>`);
  const s = el(`<div class="screen" style="left:${-SW / 2}px;top:${-SH / 2}px;width:${SW}px;height:${SH}px"></div>`);
  // status bar
  el(`<div class="abs" style="left:38px;top:17px;font-size:16px;font-weight:620;letter-spacing:-.01em">9:41</div>`, s);
  el(`<div class="abs" style="left:${SW / 2 - 62}px;top:11px;width:124px;height:36px;border-radius:20px;background:var(--ink)"></div>`, s);
  el(`<svg class="abs" style="left:${SW - 106}px;top:20px" width="76" height="14" viewBox="0 0 76 14">
      <g fill="#15140F"><rect x="0" y="9" width="3.2" height="4.5" rx="1"/><rect x="5" y="6.5" width="3.2" height="7" rx="1"/><rect x="10" y="4" width="3.2" height="9.5" rx="1"/><rect x="15" y="1.5" width="3.2" height="12" rx="1"/></g>
      <path d="M29 5.2a9 9 0 0 1 12 0M31.4 8a5.4 5.4 0 0 1 7.2 0" stroke="#15140F" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="35" cy="11.3" r="1.6" fill="#15140F"/>
      <rect x="48.5" y="1.5" width="23" height="11" rx="3.4" stroke="#15140F" stroke-opacity=".4" fill="none"/><rect x="50.5" y="3.5" width="17" height="7" rx="1.8" fill="#15140F"/><rect x="73" y="5" width="1.8" height="4" rx=".9" fill="#15140F" fill-opacity=".4"/></svg>`, s);
  // header
  el(`<div class="abs" style="left:0;top:60px;width:${SW}px;height:66px;border-bottom:1px solid var(--ruled-soft);display:flex;align-items:center;gap:12px;padding:0 20px">
      <span style="width:40px;height:40px;border-radius:13px;background:var(--indigo-grad);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(39,63,150,.18),0 18px 30px -16px rgba(39,63,150,.55)">${COPILOT_MARK(19, '#fff', '#fff')}</span>
      <span style="flex:1"><div style="font-size:16px;font-weight:640;letter-spacing:-.01em">Co-Pilot</div>
      <div class="mono" style="font-size:9.5px;color:var(--faint);margin-top:3px;display:flex;align-items:center;gap:6px"><i style="width:6px;height:6px;border-radius:50%;background:#2E9E50;display:block"></i>Online · matchfoundr</div></span>
      <span class="mono" style="font-size:9.5px;padding:4px 9px;border-radius:999px;background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:6px"><i style="width:5px;height:5px;border-radius:50%;background:var(--ember);display:block"></i>AI</span></div>`, s);
  // composer
  el(`<div class="abs" style="left:14px;top:${SH - 84}px;width:${SW - 28}px;height:50px;border-radius:18px;background:var(--surface);border:1px solid var(--ruled);display:flex;align-items:center;padding:0 6px 0 16px;font-size:14.5px;color:var(--faint)">
      <span style="flex:1">Ask your Co-Pilot…</span><span style="width:38px;height:38px;border-radius:13px;background:var(--indigo-grad);display:flex;align-items:center;justify-content:center;opacity:.92">${ICON_SEND.replace('width="20" height="20"', 'width="17" height="17"')}</span></div>`, s);
  el(`<div class="abs" style="left:${SW / 2 - 70}px;top:${SH - 13}px;width:140px;height:5px;border-radius:3px;background:var(--ink)"></div>`, s);
  return s;
}

// ── Scenes ──────────────────────────────────────────────────────────────────
const SCENES = {
  // Beat 5.5 of 32 — typing nearly done, camera ~2.9× into the composer.
  ask() {
    STAGE.style.background = 'var(--canvas)';
    const W = 430, H = 214, x = -W / 2, y = -H / 2;
    el(`<div class="glow" style="left:${x - 12}px;top:${y - 12}px;width:${W + 24}px;height:${H + 24}px;--a:130deg"></div>`);
    el(`<div class="edge" style="left:${x - 2}px;top:${y - 2}px;width:${W + 4}px;height:${H + 4}px;--a:130deg"></div>`);
    const c = el(`<div class="composer" style="left:${x}px;top:${y}px;width:${W}px;height:${H}px"></div>`);
    el(`<div class="abs mono" style="left:24px;top:22px;font-size:10px;color:var(--faint);display:flex;align-items:center;gap:7px">${COPILOT_MARK(14, '#3756C4', '#E2511C')}Co-Pilot</div>`, c);
    const typed = [REQUEST[0], REQUEST[1], REQUEST[2].slice(0, -3)];
    typed.forEach((l, i) => el(`<div class="abs" style="left:24px;top:${52 + i * 28}px;font-size:19.5px;line-height:28px;letter-spacing:-.005em;white-space:pre">${l}${i === 2 ? '<span style="display:inline-block;width:2px;height:23px;background:var(--indigo);vertical-align:-4px;margin-left:1px"></span>' : ''}</div>`, c));
    el(`<div class="abs" style="left:20px;top:${H - 58}px;width:40px;height:40px;border-radius:13px;border:1px solid var(--ruled);display:flex;align-items:center;justify-content:center;color:var(--smoke);font-size:22px;font-weight:300">+</div>`, c);
    el(`<div class="send" style="left:${W - 64}px;top:${H - 62}px">${ICON_SEND}</div>`, c);
    camera(2.9, 0, 4);
    label('01 · Ask · beat 5.5');
  },

  // Beat 15.2 — ember flood holds the frame, strip landed on Anna.
  drop() {
    STAGE.style.background = 'var(--ember)';
    el(`<div class="abs mono" style="left:-200px;top:-330px;width:400px;text-align:center;font-size:12.5px;color:rgba(251,250,247,.82)">6 matches · ranked by fit</div>`);
    const pitch = 366;
    PROFILES.forEach((p, i) => profileCard(p, i, (i - 3) * pitch, 10, { best: i === 3 }));
    camera(1.07, 0, 0);
    label('02 · Drop · beat 15');
  },

  // Beat 19.3 — answer in, pills up, cursor on "Yes, Friday".
  chat() {
    STAGE.style.background = 'var(--canvas)';
    el(`<div class="glow" style="left:${-SW / 2 - 30}px;top:${-SH / 2 - 30}px;width:${SW + 60}px;height:${SH + 60}px;border-radius:90px;filter:blur(40px);opacity:.38;--a:210deg"></div>`);
    const s = phone();
    el(`<div class="bubble-u" style="right:18px;top:150px">${REQUEST.join('\n')}</div>`, s);
    el(`<div class="abs mono" style="right:20px;top:248px;font-size:9.5px;color:var(--faint);letter-spacing:.1em">You · 09:41</div>`, s);
    // compact Anna card (the chosen card, landed in its slot)
    const p = PROFILES[3];
    el(`<div class="abs" style="left:18px;top:278px;width:300px;height:92px;border-radius:20px;background:var(--ink);color:var(--cream);box-shadow:0 18px 36px -22px rgba(21,20,15,.6)">
        <div class="abs" style="left:10px;top:10px;width:72px;height:72px;border-radius:14px;overflow:hidden">${portrait(p.hue, 72, 72, 3)}</div>
        <div class="abs" style="left:96px;top:17px;font-size:16px;font-weight:620">${p.n}</div>
        <div class="abs mono" style="left:96px;top:42px;font-size:9.5px;color:rgba(251,250,247,.52)">${p.r}</div>
        <div class="abs" style="left:96px;top:60px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:rgba(251,250,247,.8)"><i style="width:6px;height:6px;border-radius:50%;background:var(--ember);display:block"></i>Best match</div>
        <div class="abs" style="right:16px;top:22px;text-align:right"><div style="font-size:26px;font-weight:720;color:var(--ember-light);letter-spacing:-.02em;line-height:1">${p.fit}</div><div class="mono" style="font-size:9px;color:rgba(251,250,247,.5);margin-top:4px">Fit</div></div></div>`, s);
    el(`<div class="bubble-a" style="left:18px;top:384px;width:326px">Found her. Anna Wojcik, full-stack in Berlin, AI-focused, and her MVP already has 50 customers.</div>`, s);
    el(`<div class="bubble-a" style="left:18px;top:502px">Want me to set up a call for Friday?</div>`, s);
    el(`<div class="abs mono" style="left:20px;top:556px;font-size:9.5px;color:var(--faint);letter-spacing:.1em">Co-Pilot · 09:41</div>`, s);
    el(`<div class="pill" style="left:18px;top:586px;background:var(--ink);color:var(--cream);box-shadow:0 14px 26px -16px rgba(21,20,15,.7)">Yes, Friday</div>`, s);
    el(`<div class="pill" style="left:150px;top:586px;border:1.5px solid rgba(21,20,15,.18);color:var(--ink);background:var(--surface)">Show me more</div>`, s);
    // pointer
    el(`<svg class="abs" style="left:122px;top:614px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))" width="22" height="30" viewBox="0 0 22 30"><path d="M2 2 L2 24 L8 18.5 L12.5 28 L16 26.4 L11.6 17 L19.5 17 Z" fill="#15140F" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`, s);
    camera(1.12, 0, 34);
    label('03 · Chat · beat 19.3');
  },

  // Beat 31.5 — end card.
  outro() {
    STAGE.style.background = 'var(--ink)';
    const L = el(`<div class="abs" style="left:960px;top:0;height:1080px;width:0"></div>`, STAGE);
    el(`<div class="abs mono" style="left:-400px;top:362px;width:800px;text-align:center;font-size:17px;letter-spacing:.34em;color:rgba(251,250,247,.5)">Meet your</div>`, L);
    el(`<div class="abs" style="left:-520px;top:430px;width:1040px;display:flex;align-items:center;justify-content:center;gap:44px">
        ${ICON_MF(96, '#FBFAF7', '#E2511C')}
        <span style="font-weight:700;font-size:112px;letter-spacing:-.035em;color:#FBFAF7;line-height:1">matchfoundr<span style="color:#E2511C">.</span></span></div>`, L);
    el(`<div class="abs" style="left:-500px;top:584px;width:1000px;text-align:center;font-family:var(--serif);font-style:italic;font-size:132px;line-height:1;color:#FBFAF7;letter-spacing:-.01em">Co-Pilot</div>`, L);
    label('04 · Outro · beat 31.5');
  },

  // Bonus: the 92px line moment (beat 26.5).
  lines() {
    STAGE.style.background = 'var(--ink)';
    el(`<div class="abs" style="left:0;top:404px;width:1920px;text-align:center;font-size:92px;font-weight:640;letter-spacing:-.035em;color:#FBFAF7;line-height:1.12">You were building alone.<br>Friday, you meet <span style="color:#F2622A">Anna</span>.</div>`, STAGE);
    label('04b · Outro lines · beat 26.5');
  },
};

const scene = new URLSearchParams(location.search).get('s') || 'ask';
document.fonts.ready.then(() => { SCENES[scene](); document.body.dataset.ready = '1'; });
</script>
</body>
</html>
