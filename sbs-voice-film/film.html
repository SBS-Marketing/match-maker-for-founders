<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SBS Voice-Agent</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --canvas:#f6f8fc; --white:#ffffff; --ink:#0b1220; --slate:#5b6475; --slate2:#94a3b8; --line:rgba(15,23,42,.08);
  --em:#10b981; --em2:#059669; --em3:#047857; --mint:#6ee7b7; --mint2:#e6fbf3; --blue:#e3e9f5; --peach:#fdd9bf;
  --black:#050505; --red:#dc2626;
  --sora:"Sora",system-ui,sans-serif; --man:"Manrope",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--canvas);font-family:var(--man);color:var(--ink);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#cam{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.a{position:absolute}
.mask{position:absolute;overflow:hidden}
.mask>.in{display:block;white-space:pre}
.hide{display:none!important}
.lbl{font-family:var(--man);font-weight:700;text-transform:uppercase;letter-spacing:.12em}

#grid{left:-1800px;top:-1300px;width:3600px;height:2600px;background-image:linear-gradient(rgba(15,23,42,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.05) 1px,transparent 1px);background-size:56px 56px;background-position:-1px -1px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
#glow{border-radius:50%;background:radial-gradient(closest-side,rgba(16,185,129,.16) 0%,rgba(16,185,129,.06) 50%,rgba(16,185,129,0) 100%)}
#phone{z-index:5}
#bezel{background:var(--ink);box-shadow:0 60px 110px -50px rgba(11,18,32,.55),0 0 0 1.5px #1e293b inset}
#screen{overflow:hidden;background:radial-gradient(120% 60% at 50% 0%,#e6fbf3 0%,#ffffff 62%)}
.key{background:#1e293b;border-radius:3px}
#content{position:absolute;left:0;top:0}
#isl{background:var(--black);overflow:hidden}
.btn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ring{position:absolute;border-radius:50%;border-style:solid;border-color:var(--em)}
.bar{position:absolute;width:6px;border-radius:3px}
.grp{position:absolute;left:0;top:0;width:430px}
.bub{position:absolute;overflow:hidden;font-family:var(--man);font-weight:500;font-size:17px}
.bub.ki{background:var(--em);color:#fff;border-radius:4px 18px 18px 18px}
.bub.an{background:#fff;color:var(--ink);border-radius:18px 4px 18px 18px;box-shadow:0 0 0 1px rgba(15,23,42,.08) inset,0 10px 24px -18px rgba(15,23,42,.3)}
.wd{position:absolute;overflow:hidden;height:27px;padding:0 1px}
.wd>span{display:block;line-height:27px;white-space:pre}
.mk{position:absolute;border-radius:5px;transform-origin:0 50%}
#world2{z-index:6}
#hud{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:40;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div id="grid" class="a"></div>
    <div id="glow" class="a"></div>
    <div id="phone" class="a">
      <div id="bezel" class="a"></div>
      <div id="screen" class="a"><div id="content"></div></div>
    </div>
    <div id="world2" class="a"></div>
  </div>
  <div id="hud"></div>
</div>
<script src="timing.js"></script>
<script src="assets/sbs-logo-paths.js"></script>
<script>
'use strict';
// ════════════════════════════════════════════════════════════════════════════
// Every variable is declared up here, before the first seek(). seek(t) derives
// every style from t alone: no CSS transitions, timers or state between frames.
// Times hang off the measured voice lines in timing.js (tools/voice.py, timing.py).
// ════════════════════════════════════════════════════════════════════════════
const FPS = 60, BPM = 100, BEAT = 60 / BPM;
const B = (b) => b * BEAT;
const Q = (t) => 0.15 * Math.ceil(t / 0.15 - 1e-6);          // next quarter beat

// ── Voice lines → absolute times ────────────────────────────────────────────
const T_ACCEPT = B(4), L1_START = T_ACCEPT + 0.45;
const GAPS = [0, 0.25, 0.25, 0.25, 0.25, 0.3, 0.25];           // silence before each dialogue line
const LINES = (() => {
  const out = [];
  let t = L1_START;
  VOICE.lines.slice(0, 7).forEach((l, i) => {
    t += GAPS[i];
    out.push({ ...l, s: t, e: t + l.dur, ki: l.who === 'ki', words: l.words.map((w) => ({ ...w, t: t + w.s, te: t + w.e })) });
    t += l.dur;
  });
  return out;
})();
const OUTRO_VO = VOICE.lines[7];
const W = (li, k) => LINES[li].words[k];                       // word k of line li (absolute .t/.te)
const HANGUP = LINES[6].e + 0.12;

// ── Phone geometry (world). Screen-local (sx, sy) → world (PX + sx, PY + sy). ─
const SW = 430, SH = 900, BZ = 12, SR = 58;
let PCX = -560, PCY = 0;                                       // phone centre (world)
const PX = () => PCX - SW / 2, PY = () => PCY - SH / 2;
const ISL0 = { w: 118, h: 34, r: 17, top: 11 };                // idle island
const BAN = { w: 404, h: 88, r: 30, top: 11 };                 // incoming-call banner
const LIVE_ISL = { w: 172, h: 34, r: 17, top: 11 };            // island while the call runs
const ACC = { x: 352, y: 44 }, DEC = { x: 296, y: 44 }, BTN = 46;  // banner-local button centres
const ORB = { x: 215, y: 226, d: 124 };                        // agent orb (screen-local)
const BARS = { n: 32, w: 6, gap: 4, y: 330 };
const TR = { top: 436, bot: 886, maxText: 300, padX: 16, padY: 11, lh: 26, gap: 12, label: 19 };

// ── Ring / pickup schedule ──────────────────────────────────────────────────
const T_BANNER = 0.3, RINGS = [B(1), B(2), B(3)], T_TAKEOVER = 1.62;

// ── Measured at init ────────────────────────────────────────────────────────
let CAM_KEYS = [], LAYOUT = [];
const els = {};

// ── Math ────────────────────────────────────────────────────────────────────
const clamp = (v, lo = 0, hi = 1) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const loglerp = (a, b, t) => Math.exp(lerp(Math.log(a), Math.log(b), t));
const E = {
  inOutCubic: (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2),
  outCubic: (u) => 1 - Math.pow(1 - u, 3),
  inCubic: (u) => u * u * u,
  inOutSine: (u) => -(Math.cos(Math.PI * u) - 1) / 2,
  outQuart: (u) => 1 - Math.pow(1 - u, 4),
  linear: (u) => u,
};
// Closed-form step response of a damped spring (0 → 1), t in seconds since start.
function spring(t, f = 1.8, z = 0.7) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + ((z * w) / wd) * Math.sin(wd * t));
}
// Sum of spring steps: value that jumps by steps[k].d at steps[k].t, smoothed by one spring.
const springSteps = (t, v0, steps, f, z) => steps.reduce((v, s) => v + s.d * spring(t - s.t, f, z), v0);
const press = (t, tau) => (t <= 0 ? 0 : (t / tau) * Math.exp(1 - t / tau));
const rise = (t, t0, f = 2.4) => (1 - spring(t - t0, f, 1)) * 115;      // % translateY, from mask line
const fall = (t, t0, d = 0.28) => -115 * E.inCubic(seg(t, t0, t0 + d)); // % translateY, out through mask
const roll = (t, tOut, tIn) => (t < tIn ? fall(t, tOut, Math.min(0.26, tIn - tOut)) : rise(t, tIn));
const px = (v) => v.toFixed(2) + 'px';
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const quad = (a, c, b, u) => [(1 - u) * (1 - u) * a[0] + 2 * (1 - u) * u * c[0] + u * u * b[0], (1 - u) * (1 - u) * a[1] + 2 * (1 - u) * u * c[1] + u * u * b[1]];

// ── DOM helpers ─────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
function h(html, parent) { const t = document.createElement('template'); t.innerHTML = html.trim(); const n = t.content.firstChild; parent.appendChild(n); return n; }
function domWidth(str, css) { const s = document.createElement('span'); s.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;left:0;top:0;' + css; s.textContent = str; $('stage').appendChild(s); const w = s.getBoundingClientRect().width; s.remove(); return w; }
function setBox(el, l, t, w, hh) { el.style.left = px(l); el.style.top = px(t); el.style.width = px(w); el.style.height = px(hh); }
const tf = (el, v) => { el.style.transform = v; };
const show = (el, on) => { el.classList.toggle('hide', !on); };
const ty = (el, pct) => tf(el, `translateY(${pct.toFixed(2)}%)`);

const HELMET = (size, fill) => `<svg width="${size}" height="${(size * 456) / 447}" viewBox="31 28 447 456" style="display:block"><path d="${window.SBS_HELMET_D}" fill="${fill}" fill-rule="evenodd"/></svg>`;
const HANDSET = (s, rot = 0) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="#fff" style="display:block;transform:rotate(${rot}deg)"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>`;
const PERSON = (s, c) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${c}" style="display:block"><circle cx="12" cy="8.2" r="4.2"/><path d="M3.8 21c.6-4.4 4-7.2 8.2-7.2s7.6 2.8 8.2 7.2z"/></svg>`;
const CHECK = (s, c, w = 3) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M6 12.5l4 4 8-9"/></svg>`;

// ════════════════════════════════════════════════════════════════════════════
// Build
// ════════════════════════════════════════════════════════════════════════════
function build() {
  const C = $('content');
  ['grid', 'glow', 'phone', 'bezel', 'screen', 'content', 'world2', 'hud'].forEach((k) => (els[k] = $(k)));

  // ── status bar + lock screen ──
  h(`<div class="a" id="sbTime" style="left:36px;top:15px;font-weight:700;font-size:15px;line-height:20px">07:52</div>`, C);
  h(`<svg class="a" style="left:${SW - 98}px;top:19px" width="66" height="13" viewBox="0 0 66 13">
      <g fill="#0b1220"><rect x="0" y="8.5" width="3" height="4" rx="1"/><rect x="4.6" y="6" width="3" height="6.5" rx="1"/><rect x="9.2" y="3.5" width="3" height="9" rx="1"/><rect x="13.8" y="1" width="3" height="11.5" rx="1"/></g>
      <path d="M24 5a8 8 0 0 1 11 0M26.2 7.7a4.8 4.8 0 0 1 6.6 0" stroke="#0b1220" stroke-width="1.7" fill="none" stroke-linecap="round"/><circle cx="29.5" cy="10.6" r="1.5" fill="#0b1220"/>
      <rect x="41" y="1" width="21.5" height="11" rx="3.2" stroke="#0b1220" stroke-opacity=".38" fill="none"/><rect x="43" y="3" width="15" height="7" rx="1.6" fill="#0b1220"/><rect x="63.6" y="4.4" width="1.8" height="4.2" rx=".9" fill="#0b1220" fill-opacity=".38"/></svg>`, C);
  h(`<div class="mask" style="left:0;top:104px;width:${SW}px;height:24px;text-align:center"><span class="in" id="lockDate" style="font-weight:600;font-size:17px;line-height:24px;color:var(--slate)">Mittwoch, 14. Oktober</span></div>`, C);
  h(`<div class="mask" style="left:0;top:126px;width:${SW}px;height:120px;text-align:center"><span class="in" id="lockClock" style="font-family:var(--sora);font-weight:600;font-size:104px;line-height:120px;letter-spacing:-.05em">07:52</span></div>`, C);
  h(`<div class="a" id="homebar" style="left:${SW / 2 - 70}px;top:${SH - 14}px;width:140px;height:5px;border-radius:3px;background:var(--ink)"></div>`, C);

  // ── call screen (rises after the pickup) ──
  h(`<div class="a" id="cBadge" style="left:22px;top:58px;width:34px;height:34px;border-radius:11px;background:var(--ink);display:flex;align-items:center;justify-content:center">${HELMET(21, '#fff')}</div>`, C);
  h(`<div class="mask lbl" style="left:66px;top:66px;width:200px;height:18px;font-size:11.5px;color:var(--slate)"><span class="in" id="cEyebrow" style="line-height:18px">SBS Voice-Agent</span></div>`, C);
  h(`<div class="mask lbl" style="left:${SW - 172}px;top:66px;width:150px;height:18px;font-size:11.5px;letter-spacing:.08em;color:var(--em2);text-align:right"><span class="in" id="cLive" style="line-height:18px"><i id="liveDot" style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--em);margin-right:7px;vertical-align:1px"></i>Live</span></div>`, C);
  h(`<div class="mask lbl" style="left:${SW - 172}px;top:66px;width:150px;height:18px;font-size:11.5px;letter-spacing:.08em;color:var(--slate);text-align:right"><span class="in" id="cEnded" style="line-height:18px">Beendet</span></div>`, C);
  h(`<div class="a" id="cScen" style="left:${SW / 2}px;top:106px;height:30px;padding:0 15px;border-radius:999px;background:rgba(15,23,42,.05);font-weight:600;font-size:12.5px;line-height:30px;color:var(--slate);white-space:nowrap;transform-origin:50% 50%">Szenario: Elektro Wagner GmbH · Notdienst-Anfrage</div>`, C);
  els.pulses = [0, 1].map((i) => h(`<div class="ring" id="pulse${i}"></div>`, C));
  els.bars = Array.from({ length: BARS.n }, (_, i) => h(`<div class="bar" id="bar${i}"></div>`, C));
  h(`<div class="mask" style="left:0;top:${BARS.y + 38}px;width:${SW}px;height:24px;text-align:center"><span class="in" id="status" style="font-family:var(--sora);font-weight:600;font-size:15.5px;line-height:24px">Agent spricht …</span></div>`, C);
  h(`<div class="mask lbl" style="left:24px;top:404px;width:200px;height:17px;font-size:11px;color:var(--slate)"><span class="in" id="trLabel" style="line-height:17px">Live-Transkript</span></div>`, C);
  h(`<div class="mask" style="left:${SW - 224}px;top:403px;width:200px;height:18px;font-weight:600;font-size:12.5px;color:var(--em2);text-align:right"><span class="in" id="trCount" style="line-height:18px">1 Beitrag</span></div>`, C);
  h(`<div class="a" id="trRule" style="left:24px;top:428px;width:${SW - 48}px;height:1px;background:rgba(15,23,42,.08);transform-origin:50% 50%"></div>`, C);
  const view = h(`<div class="a" id="trView" style="left:0;top:${TR.top}px;width:${SW}px;height:${TR.bot - TR.top}px;overflow:hidden"></div>`, C);

  // transcript groups: label + bubble with per-word masks
  LAYOUT = LINES.map((l, li) => {
    const css = 'font-family:Manrope;font-weight:500;font-size:17px';
    const space = domWidth(' ', css);
    const ws = l.text.split(' ').map((w) => ({ w, wd: domWidth(w, css) }));
    let x = 0, row = 0;
    ws.forEach((o) => {
      if (x > 0 && x + space + o.wd > TR.maxText) { x = 0; row++; }
      if (x > 0) x += space;
      o.x = x; o.row = row; x += o.wd;
    });
    // bubble size after each revealed word
    const sizes = ws.map((_, k) => {
      const rows = ws[k].row + 1;
      let wmax = 0;
      for (let j = 0; j <= k; j++) wmax = Math.max(wmax, ws[j].x + ws[j].wd);
      return { w: Math.ceil(wmax) + TR.padX * 2 + 2, h: rows * TR.lh + TR.padY * 2 };
    });
    const g = h(`<div class="grp" id="g${li}"></div>`, view);
    const lab = h(`<div class="mask lbl" style="${l.ki ? 'left:20px' : `left:${SW - 220}px;text-align:right`};top:0;width:200px;height:15px;font-size:10px;color:${l.ki ? 'var(--em2)' : 'var(--slate)'}"><span class="in" style="line-height:15px">${l.ki ? 'KI-Agent' : 'Anruferin'}</span></div>`, g);
    const bub = h(`<div class="bub ${l.ki ? 'ki' : 'an'}" style="top:${TR.label}px"></div>`, g);
    const words = ws.map((o) => {
      const m = h(`<div class="wd" style="left:${TR.padX + o.x - 1}px;top:${TR.padY + o.row * TR.lh}px"><span>${o.w}</span></div>`, bub);
      return { ...o, el: m.firstChild, mask: m };
    });
    return { g, lab: lab.firstChild, bub, words, sizes, ki: l.ki };
  });

  // ── island / banner (screen-local, above everything in the screen) ──
  const isl = h(`<div class="a" id="isl"></div>`, C);
  h(`<div class="btn" id="avatar" style="left:18px;top:18px;width:52px;height:52px;background:#1c2536">${PERSON(26, '#e3e9f5')}</div>`, isl);
  h(`<div class="mask lbl" style="left:84px;top:22px;width:190px;height:16px;font-size:10px;letter-spacing:.14em;color:var(--mint)"><span class="in" id="bEyebrow" style="line-height:16px">Notdienst-Leitung</span></div>`, isl);
  h(`<div class="mask" style="left:84px;top:40px;width:200px;height:26px"><span class="in" id="bTitle" style="font-weight:700;font-size:18px;line-height:26px;color:#fff;letter-spacing:-.01em">Eingehender Anruf</span></div>`, isl);
  h(`<div class="mask" style="left:84px;top:40px;width:200px;height:26px"><span class="in" id="bTitle2" style="font-weight:700;font-size:18px;line-height:26px;color:#fff;letter-spacing:-.01em">KI-Agent nimmt an …</span></div>`, isl);
  h(`<div class="btn" id="decline" style="width:${BTN}px;height:${BTN}px;background:var(--red)">${HANDSET(21, 135)}</div>`, isl);
  // live island content
  h(`<div class="a" id="liveBars" style="left:16px;top:10px;width:30px;height:14px"></div>`, isl);
  els.mini = [0, 1, 2, 3].map((i) => h(`<div class="a" style="left:${i * 6}px;width:3.4px;border-radius:2px;background:var(--em)"></div>`, $('liveBars')));
  h(`<div class="a" id="liveTime" style="right:16px;top:0;line-height:34px;font-weight:700;font-size:13.5px;color:var(--em)">0:00</div>`, isl);

  // accept button: world layer (it leaves the banner and becomes the agent orb)
  const acc = h(`<div class="btn" id="accept" style="overflow:visible"></div>`, els.world2);
  h(`<div class="a" id="orbHelm" style="left:8%;top:8%;width:84%;height:84%;filter:drop-shadow(0 18px 22px rgba(11,18,32,.25))"><svg width="100%" height="100%" viewBox="31 28 447 456"><path d="${window.SBS_HELMET_D}" fill="#0b1220" fill-rule="evenodd"/></svg></div>`, acc);
  const disc = h(`<div class="a" id="accDisc" style="left:0;top:0;width:100%;height:100%;border-radius:50%;overflow:hidden;background:linear-gradient(160deg,#10b981 0%,#059669 100%)"></div>`, acc);
  h(`<div class="a" id="accRing" style="left:0;top:0"></div>`, els.world2);
  h(`<div class="mask" style="left:0;top:0;width:100%;height:100%;border-radius:50%"><div id="accHand" style="position:absolute;left:0;top:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center">${HANDSET(22)}</div></div>`, disc);
  h(`<div class="mask" style="left:0;top:0;width:100%;height:100%;border-radius:50%"><div id="accHelm" style="position:absolute;left:0;top:0;width:100%;height:100%"><div id="accHelmSvg" style="position:absolute;left:50%;top:50%;transform-origin:0 0">${HELMET(100, '#fff')}</div></div></div>`, disc);
  els.accRings = [0, 1, 2, 3].map((i) => h(`<div class="ring" style="border-color:var(--em)"></div>`, els.world2));

  // camera: [time, zoom, x, y, ease into this key]
  const islW = { x: PCX, y: PY() + BAN.top + BAN.h / 2 };
  CAM_KEYS = [
    [0, 2.7, islW.x, islW.y + 92, 'linear'],
    [T_ACCEPT, 2.55, islW.x, islW.y + 118, 'inOutSine'],              // ring: slow drift
    [LINES[0].e, 1.12, PCX, PCY, 'inOutCubic'],                         // pickup: pull back to the whole phone
    [LINES[1].e, 1.1, PCX + 24, PCY + 12, 'inOutSine'],                 // placeholder until the background exists
    [LINES[6].e + 6, 1.1, PCX + 24, PCY + 12, 'linear'],
  ];
}

// ════════════════════════════════════════════════════════════════════════════
// seek(t)
// ════════════════════════════════════════════════════════════════════════════
function camAt(t) {
  let i = 1;
  while (i < CAM_KEYS.length - 1 && t > CAM_KEYS[i][0]) i++;
  const a = CAM_KEYS[i - 1], b = CAM_KEYS[i], e = E[b[4]](seg(t, a[0], b[0]));
  return { z: loglerp(a[1], b[1], e), x: lerp(a[2], b[2], e), y: lerp(a[3], b[3], e) };
}
const lineAt = (t) => LINES.findIndex((l) => t >= l.s && t < l.e);
function envAt(t) {
  const i = lineAt(t);
  if (i < 0) return { v: 0, ki: true, i };
  const l = LINES[i], f = (t - l.s) * 100, k = Math.floor(f), env = l.env;
  const v = lerp(env[Math.min(k, env.length - 1)] || 0, env[Math.min(k + 1, env.length - 1)] || 0, f - k);
  return { v, ki: l.ki, i };
}
// who spoke last (for colours between lines)
const lastSpeaker = (t) => { let k = 0; for (let i = 0; i < LINES.length; i++) if (t >= LINES[i].s - 0.06) k = i; return k; };

function seek(t) {
  const cam = camAt(t);
  tf($('cam'), `translate(960px,540px) scale(${cam.z.toFixed(5)}) translate(${(-cam.x).toFixed(3)}px,${(-cam.y).toFixed(3)}px)`);

  // ── canvas ──
  setBox(els.glow, PCX - 900, PCY - 700, 1800, 1400);

  // ── phone body: buzz while ringing ──
  let buzz = 0;
  RINGS.forEach((r) => { const d = t - r; if (d > 0 && d < 0.32) buzz += 2.4 * Math.sin(2 * Math.PI * 30 * d) * (1 - d / 0.32); });
  tf(els.phone, `translate(${buzz.toFixed(2)}px,0)`);
  setBox(els.bezel, PX() - BZ, PY() - BZ, SW + BZ * 2, SH + BZ * 2);
  els.bezel.style.borderRadius = px(SR + BZ);
  setBox(els.screen, PX(), PY(), SW, SH);
  els.screen.style.borderRadius = px(SR);

  phoneScreen(t);
  acceptButton(t, buzz);
}

// ── Island → banner → live island; lock screen; call header, bars, transcript ──
function phoneScreen(t) {
  // island geometry
  const open = spring(t - T_BANNER, 1.55, 0.78);                       // idle → banner
  const shut = spring(t - (T_ACCEPT + 0.14), 1.7, 0.86);               // banner → live island
  const w = lerp(lerp(ISL0.w, BAN.w, open), LIVE_ISL.w, shut);
  const hh = lerp(lerp(ISL0.h, BAN.h, spring(t - T_BANNER - 0.03, 1.55, 0.82)), LIVE_ISL.h, shut);
  const r = lerp(lerp(ISL0.r, BAN.r, open), LIVE_ISL.r, shut);
  const isl = $('isl');
  setBox(isl, SW / 2 - w / 2, BAN.top, w, hh);
  isl.style.borderRadius = px(Math.min(r, hh / 2));
  const bx = SW / 2 - w / 2;                                          // banner left (screen-local)

  // banner content (positions relative to the banner box; scales with its spring)
  const inBanner = t < T_ACCEPT + 0.5;
  const av = $('avatar');
  show(av, inBanner);
  const avPop = spring(t - 0.46, 2.4, 0.62) * (1 - spring(t - T_ACCEPT, 4, 1));
  tf(av, `scale(${avPop.toFixed(4)})`);
  ty($('bEyebrow'), t < T_ACCEPT ? rise(t, 0.5) : fall(t, T_ACCEPT + 0.01, 0.14));
  ty($('bTitle'), t < T_TAKEOVER ? rise(t, 0.56) : fall(t, T_TAKEOVER, 0.24));
  ty($('bTitle2'), t < T_ACCEPT ? rise(t, T_TAKEOVER + 0.16) : fall(t, T_ACCEPT + 0.01, 0.14));
  const dec = $('decline');
  setBox(dec, DEC.x - BTN / 2 + (w - BAN.w), ACC.y - BTN / 2, BTN, BTN);
  tf(dec, `scale(${(spring(t - 0.58, 2.6, 0.55) * (1 - spring(t - T_ACCEPT, 4, 1))).toFixed(4)})`);
  show(dec, inBanner);

  // live island content
  const live = t >= T_ACCEPT + 0.25;
  show($('liveBars'), live); show($('liveTime'), live);
  if (live) {
    const k = spring(t - (T_ACCEPT + 0.4), 2.2, 0.8);
    tf($('liveBars'), `scale(${k.toFixed(4)})`); tf($('liveTime'), `scale(${k.toFixed(4)})`);
    const ended = t >= HANGUP;
    const secs = Math.floor(Math.max(0, Math.min(t, HANGUP) - T_ACCEPT));
    $('liveTime').textContent = `0:${String(secs).padStart(2, '0')}`;
    const ev = envAt(t);
    els.mini.forEach((m, i) => {
      const hv = ended ? 3.4 : 3.4 + 10 * ev.v * (0.55 + 0.45 * Math.sin(t * (9 + i * 2.3) + i));
      m.style.height = px(hv); m.style.top = px(7 - hv / 2);
      m.style.background = ended ? 'var(--slate2)' : 'var(--em)';
    });
  }

  // lock screen out after the pickup
  ty($('lockDate'), fall(t, T_ACCEPT + 0.06, 0.26));
  ty($('lockClock'), fall(t, T_ACCEPT + 0.1, 0.3));

  // call header (the website's voice-agent card header)
  const hdr = T_ACCEPT + 0.4;
  tf($('cBadge'), `scale(${spring(t - hdr, 2.4, 0.62).toFixed(4)})`);
  ty($('cEyebrow'), rise(t, hdr + 0.06));
  ty($('cLive'), t < HANGUP ? rise(t, hdr + 0.12) : fall(t, HANGUP, 0.22));
  ty($('cEnded'), t < HANGUP + 0.16 ? 115 : rise(t, HANGUP + 0.16));
  $('liveDot').style.transform = `scale(${(0.75 + 0.25 * Math.cos(2 * Math.PI * t / (2 * BEAT))).toFixed(3)})`;
  const scen = $('cScen');
  scen.style.marginLeft = px(-scen.offsetWidth / 2);
  tf(scen, `scale(${spring(t - (hdr + 0.16), 2.2, 0.7).toFixed(4)})`);

  // status line: the website's strings, swapped through the mask at each turn
  const ST_KI = 'Agent spricht …', ST_AN = 'Anruferin spricht …', ST_END = 'Gespräch beendet · alles erledigt';
  const swaps = [{ t: T_ACCEPT + 0.62, txt: ST_KI }];
  for (let i = 1; i < LINES.length; i++) if (LINES[i].ki !== LINES[i - 1].ki) swaps.push({ t: LINES[i].s - 0.04, txt: LINES[i].ki ? ST_KI : ST_AN });
  swaps.push({ t: HANGUP, txt: ST_END });
  let si = 0;
  while (si < swaps.length - 1 && t >= swaps[si + 1].t - 0.2) si++;
  const nxt = swaps[si + 1], cur = swaps[si];
  const stEl = $('status');
  if (si === 0 && t < cur.t + 0.01) { stEl.textContent = cur.txt; ty(stEl, rise(t, cur.t)); }
  else if (nxt && t >= nxt.t - 0.2) { stEl.textContent = t < nxt.t ? cur.txt : nxt.txt; ty(stEl, roll(t, nxt.t - 0.2, nxt.t)); }
  else if (t < cur.t && si > 0) { stEl.textContent = cur.txt; ty(stEl, rise(t, cur.t)); }
  else { stEl.textContent = cur.txt; ty(stEl, si === 0 ? rise(t, cur.t) : rise(t, cur.t)); }
  stEl.style.color = t >= HANGUP ? 'var(--em2)' : 'var(--ink)';

  // transcript chrome
  ty($('trLabel'), rise(t, T_ACCEPT + 0.68));
  const shown = LINES.filter((l) => t >= l.s - 0.1).length;
  const cnt = $('trCount');
  cnt.textContent = `${Math.max(1, shown)} ${shown > 1 ? 'Beiträge' : 'Beitrag'}`;
  ty(cnt, rise(t, T_ACCEPT + 0.74));
  tf($('trRule'), `scaleX(${E.outCubic(seg(t, T_ACCEPT + 0.66, T_ACCEPT + 1.06)).toFixed(4)})`);

  voiceBars(t);
  orbPulses(t);
  transcript(t);
}

function voiceBars(t) {
  const n = BARS.n, x0 = (SW - (n * BARS.w + (n - 1) * BARS.gap)) / 2;
  const ev = envAt(t), sp = lastSpeaker(t);
  const ended = t >= HANGUP;
  els.bars.forEach((b, i) => {
    const xi = x0 + i * (BARS.w + BARS.gap);
    const out = spring(t - (T_ACCEPT + 0.5) - 0.01 * Math.abs(i - 15.5), 2.1, 0.86);   // bars slide out of the orb centre
    const x = lerp(ORB.x - BARS.w / 2, xi, out);
    // website: idle = short emerald dashes, active = sin envelope x level
    const shape = 0.55 + 0.45 * Math.sin((Math.PI * (i + 0.5)) / n);
    const jit = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * (6.3 + ((i * 37) % 11) * 0.8) + i * 1.7));
    const idle = 56 * (0.08 + 0.04 * Math.sin(t * 2.5 + i / 3));
    const hv = Math.max(idle, ended ? 0 : 56 * ev.v * shape * jit);
    setBox(b, x, BARS.y - hv / 2, BARS.w, hv);
    // speaker colour flips centre-out at each line start
    const cur = LINES[sp], flip = t - (cur.s - 0.06) - Math.abs(i - 15.5) * 0.006;
    const prevKi = sp > 0 ? LINES[sp - 1].ki : true;
    const ki = flip >= 0 ? cur.ki : prevKi;
    b.style.background = ended || ki ? 'var(--em)' : 'var(--ink)';
    tf(b, `scaleY(${out.toFixed(4)})`);
    show(b, t >= T_ACCEPT + 0.5);
  });
}

function orbPulses(t) {
  // the website's orb: two 2px emerald rings that grow to 1.9x and thin to nothing, offset by half a period
  const per = 4 * BEAT, t0 = T_ACCEPT + 0.62;
  els.pulses.forEach((p, k) => {
    const d = t - t0 - k * per / 2;
    const on = d >= 0 && t < HANGUP + per;
    show(p, on);
    if (!on) return;
    const ph = (d % per) / per, u = E.outCubic(ph);
    const r = (ORB.d / 2) * lerp(1, 1.9, u);
    setBox(p, ORB.x - r, ORB.y - r, r * 2, r * 2);
    p.style.borderWidth = px(2.6 * (1 - ph));
    p.style.borderColor = 'rgba(16,185,129,.35)';
  });
}

// Transcript geometry at time t (also used to launch tokens from words).
function trGeo(t) {
  const viewH = TR.bot - TR.top;
  const geo = LAYOUT.map((L, li) => {
    const l = LINES[li], tPop = l.s - 0.1;
    let bw = L.sizes[0].w, bh = L.sizes[0].h;
    for (let k = 1; k < L.sizes.length; k++) {
      bw += (L.sizes[k].w - L.sizes[k - 1].w) * spring(t - l.words[k].t, 2.4, 0.86);
      bh += (L.sizes[k].h - L.sizes[k - 1].h) * spring(t - l.words[k].t, 2.2, 0.9);
    }
    const pop = spring(t - tPop, 2.3, 0.72);
    const gh = (TR.label + bh) * spring(t - (tPop - 0.04), 2.2, 0.95);  // space the group takes in the stack
    return { bw, bh, pop, gh, on: t >= tPop - 0.04 };
  });
  let y = 6;
  geo.forEach((g) => { g.top = y; if (g.on) y += g.gh + TR.gap; });
  const scroll = Math.max(0, y - TR.gap + 10 - viewH);
  geo.forEach((g, li) => { g.y = g.top - scroll; g.left = LAYOUT[li].ki ? 18 : SW - 18 - g.bw; });
  return geo;
}
// World rect of words k0..k1 of line li (unscaled bubble), at time t.
function wordsWorld(li, k0, k1, t, geo = trGeo(t)) {
  const L = LAYOUT[li], g = geo[li];
  const a = L.words[k0], b = L.words[k1];
  const x0 = PX() + g.left + TR.padX + a.x, x1 = PX() + g.left + TR.padX + b.x + b.wd;
  const y0 = PY() + TR.top + g.y + TR.label + TR.padY + a.row * TR.lh;
  return { x: x0, y: y0, w: x1 - x0, h: TR.lh, row: a.row };
}

function transcript(t) {
  const geo = trGeo(t);
  LAYOUT.forEach((L, li) => {
    const g = geo[li], l = LINES[li];
    show(L.g, g.on);
    if (!g.on) return;
    tf(L.g, `translateY(${g.y.toFixed(2)}px)`);
    ty(L.lab, rise(t, l.s - 0.14));
    setBox(L.bub, g.left, TR.label, g.bw, g.bh);
    L.bub.style.transformOrigin = L.ki ? '0 0' : '100% 0';
    tf(L.bub, `scale(${g.pop.toFixed(4)})`);
    L.words.forEach((w, k) => ty(w.el, rise(t, l.words[k].t - 0.03, 2.6)));
  });
  return geo;
}

// ── Accept button: rings, takeover, press, flight into the orb ──
function acceptButton(t, buzz) {
  const acc = $('accept');
  const open = spring(t - T_BANNER, 1.55, 0.78);
  const bw = lerp(ISL0.w, BAN.w, open);
  // banner position of the accept button (world)
  const bxw = PX() + SW / 2 - bw / 2, byw = PY() + BAN.top;
  const home = [bxw + ACC.x + (bw - BAN.w), byw + ACC.y];
  const orbW = [PX() + ORB.x, PY() + ORB.y];
  const fly = E.inOutCubic(seg(t, T_ACCEPT + 0.08, T_ACCEPT + 0.62));
  const c = [lerp(home[0], orbW[0], 0.5) + 70, home[1] + 30];
  const p = quad(home, c, orbW, fly);
  const grow = spring(t - (T_ACCEPT + 0.12), 1.5, 0.78);
  let d = lerp(BTN, ORB.d, grow);
  const pop = spring(t - 0.64, 2.6, 0.55);
  // ring pulses before the pickup, press at the pickup
  let s = pop;
  RINGS.forEach((r) => (s += 0.12 * press(t - r, 0.09)));
  s -= 0.16 * press(t - T_ACCEPT, 0.06);
  setBox(acc, p[0] - d / 2 + (fly < 1 ? buzz : 0), p[1] - d / 2, d, d);
  tf(acc, `scale(${s.toFixed(4)}) rotate(${(fly < 0.01 ? RINGS.reduce((v, r) => v + 12 * Math.sin(2 * Math.PI * 7 * (t - r)) * Math.exp(-6 * Math.max(0, t - r)) * (t > r ? 1 : 0), 0) : 0).toFixed(2)}deg)`);
  const T_LAND = T_ACCEPT + 0.62;
  const drain = E.inOutCubic(seg(t, T_LAND - 0.04, T_LAND + 0.36));
  const ev = envAt(t);
  const breathe = t > T_LAND ? 1 + (ev.i >= 0 ? (ev.ki ? 0.12 : 0.04) * ev.v : 0) : 1;
  if (t > T_LAND) tf(acc, `scale(${breathe.toFixed(4)})`);
  const disc = $('accDisc');
  disc.style.clipPath = `circle(${(50 * (1 - drain)).toFixed(3)}% at 50% 50%)`;
  disc.style.boxShadow = drain > 0 ? 'none' : `0 ${px(lerp(6, 26, grow))} ${px(lerp(14, 44, grow))} ${px(lerp(-6, -16, grow))} rgba(16,185,129,.7)`;
  show(disc, drain < 1);
  show($('orbHelm'), t > T_LAND - 0.1);
  // handset slides down and out; the helmet rises in (the agent takes the call)
  ty($('accHand'), t < T_TAKEOVER ? 0 : -fall(t, T_TAKEOVER + 0.1, 0.26));
  const hs = lerp(26, ORB.d * 0.823, grow);
  tf($('accHelmSvg'), `translate(${(-hs / 2).toFixed(2)}px,${(-hs * 0.51).toFixed(2)}px) scale(${(hs / 100).toFixed(4)})`);
  ty($('accHelm'), t < T_TAKEOVER + 0.24 ? 115 : rise(t, T_TAKEOVER + 0.24, 2.2));
  // emerald rings leave the button on each ring and on the pickup
  [...RINGS, T_ACCEPT].forEach((r, k) => {
    const el = els.accRings[k], dt = t - r;
    const on = dt >= 0 && dt < 0.62;
    show(el, on);
    if (!on) return;
    const u = E.outCubic(dt / 0.62), rr = BTN / 2 + 4 + 34 * u;
    setBox(el, home[0] - rr + buzz, home[1] - rr, rr * 2, rr * 2);
    el.style.borderWidth = px(3.2 * (1 - u));
  });
}

// ── Init ────────────────────────────────────────────────────────────────────
const DUR = LINES[6].e + 5.6;
window.DUR = DUR; window.FPS = FPS; window.BEAT = BEAT;
window.seek = seek;
window.EVENTS = { rings: RINGS, accept: T_ACCEPT, lines: LINES.map((l) => ({ id: l.id, s: l.s, e: l.e })), beat: BEAT, dur: DUR };
Promise.all(['500 17px Manrope', '600 17px Manrope', '700 17px Manrope', '600 20px Sora', '700 20px Sora', '800 20px Sora'].map((f) => document.fonts.load(f, 'ÄäÖöÜüß09'))).then(() => document.fonts.ready).then(() => {
  build();
  seek(0);
  document.body.dataset.ready = '1';
  const q = new URLSearchParams(location.search);
  if (q.has('t')) seek(parseFloat(q.get('t')));
  if (q.has('b')) seek(B(parseFloat(q.get('b'))));
  if (q.has('play')) { const t0 = performance.now(); const loop = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
});
</script>
</body>
